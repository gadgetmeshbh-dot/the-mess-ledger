<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Mess Ledger — Room Expenses &amp; Vishnu Tab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;7&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --ink:#141F27;--ink-soft:#4B5A63;--paper:#EFEBDF;--paper-raised:#FFFFFF;
  --rule:#DAD3BE;--emerald:#1F6F54;--emerald-dark:#164E3B;--emerald-tint:#E4EFE8;
  --azad:#2C5F8A;--azad-tint:#E2EBF2;--vishnu:#8A5A2C;--vishnu-tint:#F2E7D6;
  --rose:#9C3A32;--radius:10px;
  --shadow: 0 1px 2px rgba(20,31,39,0.06), 0 8px 24px -12px rgba(20,31,39,0.18);
}
*{box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;margin:0;padding:24px 16px;display:flex;justify-content:center;}
.container{max-width:760px;width:100%;}
h1,h2,.serif{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.brand-left{display:flex;align-items:center;gap:10px;}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--emerald);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;}
.brand-name{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
.brand-sub{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
.card{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.card-head{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;}
.card-head h3{margin:0;font-size:16px;}
.card-body{padding:20px;}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
@media(max-width:600px){.widgets{grid-template-columns:1fr;}}
.widget{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.widget-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
.widget-value{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}}
label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
input[type=text],input[type=number],input[type=date],select{
  width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);
  font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
}
input:focus,select:focus{outline:2px solid var(--emerald);outline-offset:1px;background:#fff;}
.btn{padding:10px 18px;border-radius:8px;border:none;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;}
.btn-primary{background:var(--emerald);color:#fff;}
.btn-primary:hover{background:#164E3B;}
.btn-danger{background:transparent;color:var(--rose);padding:4px 8px;font-size:12px;}
.btn-danger:hover{background:#F9EBEA;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;padding:8px 10px;border-bottom:1.5px solid var(--ink);}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:middle;}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
tr:last-child td{border-bottom:none;}
.who-chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;}
.who-chip .dot{width:7px;height:7px;border-radius:50%;}
.who-chip.irshad{color:#1F6F54;}.who-chip.irshad .dot{background:#1F6F54;}
.who-chip.azad{color:#2C5F8A;}.who-chip.azad .dot{background:#2C5F8A;}
.who-chip.vishnu{color:#8A5A2C;}.who-chip.vishnu .dot{background:#8A5A2C;}
.total-row td{font-weight:700;border-top:2px double var(--ink);border-bottom:none;padding-top:12px;}
.empty-state{text-align:center;padding:30px;color:var(--ink-soft);font-size:13.5px;}
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--emerald-tint);color:var(--emerald-dark);padding:4px 10px;border-radius:20px;font-weight:600;}
.sync-dot{width:7px;height:7px;background:var(--emerald);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.4;}100%{opacity:1;}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:9px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);z-index:200;display:none;}
.toast.show{display:block;}
</style>
</head>
<body>

<div class="container">
  <div class="brand">
    <div class="brand-left">
      <div class="brand-mark">M</div>
      <div>
        <div class="brand-name">The Mess Ledger</div>
        <div class="brand-sub">Irshad &amp; Azad Shared Room</div>
      </div>
    </div>
    <div class="sync-badge"><span class="sync-dot"></span>Live Synced</div>
  </div>

  <!-- Top 2 Widgets as previously requested -->
  <div class="widgets">
    <div class="widget">
      <div class="widget-label">Net Total You Owe</div>
      <div class="widget-value mono" id="netTotalOwe">BHD 0.000</div>
    </div>
    <div class="widget">
      <div class="widget-label">Active Records</div>
      <div class="widget-value mono" id="activeRecordsCount">0 records</div>
    </div>
  </div>

  <!-- Add Expense Card -->
  <div class="card">
    <div class="card-head"><h3>Add Room / Mess Expense</h3></div>
    <div class="card-body">
      <div class="form-row">
        <div><label>Amount (BHD)</label><input type="number" step="0.001" min="0" id="mAmount" placeholder="0.000"></div>
        <div><label>Date</label><input type="date" id="mDate"></div>
      </div>
      <div class="form-row">
        <div><label>Paid By</label>
          <select id="mPaidBy">
            <option value="irshad">Irshad</option>
            <option value="azad">Azad</option>
          </select>
        </div>
        <div><label>Description</label><input type="text" id="mDesc" placeholder="e.g. Groceries, Vegetables, Gas"></div>
      </div>
      <button class="btn btn-primary" id="addExpenseBtn">+ Add Expense</button>
    </div>
  </div>

  <!-- Vishnu's Tab Manager (Integrated in Interface with previous menu look) -->
  <div class="card">
    <div class="card-head"><h3>Log What Vishnu Spent / Paid</h3></div>
    <div class="card-body">
      <div class="form-row">
        <div><label>Amount (BHD)</label><input type="number" step="0.001" min="0" id="vAmount" placeholder="0.000"></div>
        <div><label>Date</label><input type="date" id="vDate"></div>
      </div>
      <div class="form-row">
        <div><label>Assign To / Related To</label>
          <select id="vPaidBy">
            <option value="house">General House / Both</option>
            <option value="irshad">Irshad</option>
            <option value="azad">Azad</option>
            <option value="azad-add">Paid by Azad (Added to Vishnu Tab)</option>
            <option value="irshad-add">Paid by Irshad (Added to Vishnu Tab)</option>
          </select>
        </div>
        <div><label>Description</label><input type="text" id="vDesc" placeholder="e.g. Bought groceries"></div>
      </div>
      <div style="margin-top:12px; display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="addToMess" checked style="width:auto;">
        <label for="addToMess" style="display:inline; margin:0; text-transform:none; font-weight:normal;">Also add this as a regular expense spend for the chosen person in the main room ledger</label>
      </div>
      <br>
      <button class="btn btn-primary" id="addVishnuItemBtn">💾 Save Vishnu Spend / Payment</button>
    </div>
  </div>

  <!-- Main Room Expenses Table -->
  <div class="card">
    <div class="card-head"><h3>Room Expense Log</h3></div>
    <div class="card-body" style="padding:0;">
      <div id="expenseTableWrap"></div>
    </div>
  </div>

  <!-- Vishnu Tab Log -->
  <div class="card">
    <div class="card-head"><h3>Ledger Summary (Debits &amp; Credits)</h3></div>
    <div class="card-body" style="padding:0;">
      <div id="vishnuTableWrap"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAON8q9X1QzO3usFHDut63qXfl7QglauMg",
  authDomain: "the-mess-ledger.firebaseapp.com",
  projectId: "the-mess-ledger",
  storageBucket: "the-mess-ledger.firebasestorage.app",
  messagingSenderId: "156636852771",
  appId: "1:156636852771:web:cfb333ec4f5f7bef16f796"
};

try {
  firebase.initializeApp(FIREBASE_CONFIG);
} catch(e) { console.error(e); }

const db = firebase.firestore();
const CURRENCY = 'BHD';
const fmt = (n) => `${CURRENCY} ${(Number(n)||0).toFixed(3)}`;
function fmtDate(d){ return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

document.getElementById('mDate').value = todayISO();
document.getElementById('vDate').value = todayISO();

// Listen to Main Expenses
db.collection('expenses').onSnapshot(snap => {
  let items = [];
  snap.forEach(doc => items.push({id: doc.id, ...doc.data()}));
  items.sort((a,b) => (a.date < b.date ? 1 : -1));
  renderExpenses(items);
}, err => { console.error(err); });

// Listen to Vishnu Expenses
db.collection('vishnuExpenses').where('settled','==',false).onSnapshot(snap => {
  let items = [];
  snap.forEach(doc => items.push({id: doc.id, ...doc.data()}));
  items.sort((a,b) => (a.date < b.date ? 1 : -1));
  renderVishnuTab(items);
}, err => { console.error(err); });

// Add Room Expense
document.getElementById('addExpenseBtn').addEventListener('click', async () => {
  const amount = parseFloat(document.getElementById('mAmount').value);
  const date = document.getElementById('mDate').value || todayISO();
  const paidBy = document.getElementById('mPaidBy').value;
  const description = document.getElementById('mDesc').value.trim() || 'Room Expense';

  if(!amount || amount <= 0) { showToast('Enter a valid amount.'); return; }

  await db.collection('expenses').add({
    amount, date, paidBy, description,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById('mAmount').value = '';
  document.getElementById('mDesc').value = '';
  showToast('Expense added successfully.');
});

// Add Vishnu Item / Spend
document.getElementById('addVishnuItemBtn').addEventListener('click', async () => {
  const amount = parseFloat(document.getElementById('vAmount').value);
  const date = document.getElementById('vDate').value || todayISO();
  const selection = document.getElementById('vPaidBy').value;
  const description = document.getElementById('vDesc').value.trim() || 'Shared item';
  const addToMess = document.getElementById('addToMess').checked;

  if(!amount || amount <= 0) { showToast('Enter a valid amount.'); return; }

  if(selection === 'azad-add' || selection === 'irshad-add') {
    let actualPayer = selection.replace('-add', '');
    await db.collection('vishnuExpenses').add({
      amount: Math.abs(amount), 
      date, 
      paidBy: actualPayer, 
      description, 
      settled: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast("Added to Vishnu's Tab.");
  } else {
    // Vishnu spent for house / irshad / azad
    let target = selection;
    
    // 1. Add negative credit entry to vishnuExpenses
    await db.collection('vishnuExpenses').add({
      paidBy: 'vishnu',
      target: target,
      amount: -Math.abs(amount), 
      date,
      description: `[Vishnu Paid] ${description} (${target})`,
      settled: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // 2. If checked, sync to main room expenses ledger
    if(addToMess && (target === 'irshad' || target === 'azad')) {
      await db.collection('expenses').add({
        paidBy: target,
        amount: Math.abs(amount),
        date,
        description: `[Paid via Vishnu] ${description}`,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } else if(addToMess && target === 'house') {
      let half = Math.abs(amount) / 2;
      await db.collection('expenses').add({
        paidBy: 'irshad',
        amount: half,
        date,
        description: `[House/Vishnu Split] ${description}`,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection('expenses').add({
        paidBy: 'azad',
        amount: half,
        date,
        description: `[House/Vishnu Split] ${description}`,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    showToast('Vishnu spend recorded and synced.');
  }

  document.getElementById('vAmount').value = '';
  document.getElementById('vDesc').value = '';
});

async function deleteExpense(id){
  if(confirm('Delete this expense?')) {
    await db.collection('expenses').doc(id).delete();
    showToast('Expense deleted.');
  }
}

async function deleteVishnuItem(id){
  if(confirm('Delete this item?')) {
    await db.collection('vishnuExpenses').doc(id).delete();
    showToast('Item removed.');
  }
}

function renderExpenses(items){
  let total = 0, irshad = 0, azad = 0;
  items.forEach(e => {
    let amt = Number(e.amount);
    total += amt;
    if(e.paidBy === 'irshad') irshad += amt;
    if(e.paidBy === 'azad') azad += amt;
  });

  const wrap = document.getElementById('expenseTableWrap');
  if(items.length === 0){
    wrap.innerHTML = `<div class="empty-state">No room expenses logged yet.</div>`;
    return;
  }

  let rows = items.map(e => `
    <tr>
      <td class="mono" style="color:var(--ink-soft);">${fmtDate(new Date(e.date))}</td>
      <td><span class="who-chip ${e.paidBy}"><span class="dot"></span>${e.paidBy === 'irshad' ? 'Irshad' : 'Azad'}</span></td>
      <td>${e.description}</td>
      <td class="num">${fmt(e.amount)}</td>
      <td style="text-align:right;"><button class="btn btn-danger" onclick="deleteExpense('${e.id}')">Remove</button></td>
    </tr>`).join('');

  wrap.innerHTML = `<table>
    <thead><tr><th>Date</th><th>Paid By</th><th>Description</th><th class="num">Amount</th><th style="text-align:right;">Action</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function renderVishnuTab(items){
  let totalOwes = items.reduce((sum, item) => sum + Number(item.amount), 0);
  
  // Update top widgets to match exact previous layout
  document.getElementById('netTotalOwe').textContent = fmt(totalOwes);
  document.getElementById('activeRecordsCount').textContent = `${items.length} records`;

  const wrap = document.getElementById('vishnuTableWrap');
  if(items.length === 0){
    wrap.innerHTML = `<div class="empty-state">No active entries in Vishnu's tab.</div>`;
    return;
  }

  let rows = items.map(e => {
    let isCredit = Number(e.amount) < 0;
    let typeLabel = '';
    if(e.paidBy === 'vishnu') {
      typeLabel = `<span class="who-chip vishnu"><span class="dot"></span>Vishnu Paid</span>`;
    } else {
      typeLabel = `<span class="who-chip ${e.paidBy}"><span class="dot"></span>${e.paidBy === 'irshad' ? 'Irshad' : 'Azad'} paid</span>`;
    }
    return `
      <tr>
        <td class="mono" style="color:var(--ink-soft);">${fmtDate(new Date(e.date))}</td>
        <td>${typeLabel}</td>
        <td>${e.description}</td>
        <td class="num" style="color:${isCredit ? 'var(--emerald)' : 'inherit'};">${fmt(e.amount)}</td>
        <td style="text-align:right;"><button class="btn btn-danger" onclick="deleteVishnuItem('${e.id}')">Remove</button></td>
      </tr>`;
  }).join('');

  wrap.innerHTML = `<table>
    <thead><tr><th>Date</th><th>Type</th><th>Description</th><th class="num">Amount / Effect</th><th style="text-align:right;">Action</th></tr></thead>
    <tbody>${rows}
      <tr class="total-row"><td colspan="3">Net Balance Due from Vishnu</td><td class="num">${fmt(totalOwes)}</td><td></td></tr>
    </tbody></table>`;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
</script>
</body>
</html>
